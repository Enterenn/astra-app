name: astra_app
description: ASTRA — local-first health hub
publish_to: 'none'
version: 0.13.1+33

environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  workmanager: ^0.9.0+3
  pedometer: ^4.2.0
  permission_handler: ^12.0.1
  flutter_local_notifications: ^21.0.0
  path_provider: ^2.1.5
  file_picker: 12.0.0-beta.5
  package_info_plus: ^10.1.0

  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  sqlite3: ^3.0.0
  flutter_launcher_icons: ^0.14.4

hooks:
  user_defines:
    sqlite3:
      # Windows tests/dev: use built-in winsqlite3.dll instead of copying
      # build/native_assets/windows/sqlite3.dll (avoids PathAccessException locks).
      source: system
      name_windows: winsqlite3

flutter:
  uses-material-design: false
  generate: true
  assets:
    - assets/images/app_logo.png
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-VariableFont_wght.ttf
    - family: Darker Grotesque
      fonts:
        - asset: assets/fonts/DarkerGrotesque-VariableFont_wght.ttf
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular-subset.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill-subset.ttf

flutter_launcher_icons:
  android: true
  ios: true

  # iOS — image pleine 1024×1024, fond opaque, pas de transparence
  image_path: assets/icon/ios_icon_1024.png

  # Android adaptive (API 26+) — foreground transparent + background image
  adaptive_icon_foreground: assets/icon/android_foreground_1024.png
  adaptive_icon_background: assets/icon/android_background_1024.png

  # adaptive_icon_monochrome: assets/icon/android_monochrome_1024.png  # Android 13+ thèmes
  # image_path_android: assets/icon/android_legacy_1024.png            # legacy API < 26 si besoin

  min_sdk_android: 21
