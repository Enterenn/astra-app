# Reduces parallel test runners fighting over build/native_assets/windows/sqlite3.dll
concurrency: 1
timeout: 60s
reporter: expanded

# === Test Tags ===
#
# Agent / daily default (~200 cases):
#   flutter test --tags critical
#
# Pre-merge regression (~400 cases):
#   flutter test --exclude-tags slow
#
# Full suite (epic close / nightly):
#   flutter test
#
#   critical — app shell, core cubits, data integrity (purge/import/migrations)
#   slow     — heavy I/O, full screens, pipeline integration, dev benchmarks
tags:
  critical: {}
  slow: {}
